name: Build fuckrun

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Opcional: secreto del repositorio con la clave de Google Maps (Settings > Secrets > Actions)
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Localiza settings.gradle.kts aunque el proyecto esté dentro de una subcarpeta
      - name: Localizar proyecto
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n1)
          if [ -z "$f" ]; then echo "::error::No se encuentra settings.gradle.kts en el repositorio"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Proyecto en: $(dirname "$f")"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (licencias y plataforma)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Pruebas unitarias (motor de métricas)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --console=plain

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: fuckrun-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
