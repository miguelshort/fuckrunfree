name: Build fuckrun

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # El proyecto no incluye gradle-wrapper: se usa Gradle 8.7 (compatible con AGP 8.5.2)
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Tests unitarios (motor de métricas)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: fuckrun-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
